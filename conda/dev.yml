name: zstash_dev
channels:
  - conda-forge
dependencies:
  # Base
  # =================
  - pip
  - python >=3.11,<3.15
  - setuptools
  - sqlite
  - six >=1.16.0
  - globus-sdk >=3.15.0,<4.0
  # Developer Tools
  # =================
  # Run `pre-commit autoupdate` to get the latest pinned versions of 'rev' in
  # `.pre-commit-config.yaml`, then run
  # `python scripts/sync_pre_commit_versions.py` to update the pinned versions
  # here and in the `qa` extra of pyproject.toml.
  - black ==26.5.1
  - flake8 ==7.3.0
  - flake8-isort ==6.1.2
  - isort ==6.0.1
  - mypy ==2.3.0
  - pre-commit ==4.3.0
  - pyyaml
  - tbump >=6.9.0
  # Testing
  # =======================
  - pytest
  - pytest-cov
  # Documentation
  # =================
  # If versions are updated, also update in `.github/workflows/build_workflow.yml` and `.github/workflows/release_workflow.yml`
  - jinja2 <3.1
  - sphinx >=5.2.0
  - sphinx-multiversion >=0.2.4
  - sphinx_rtd_theme >=1.0.0
  - docutils >=0.17.1
