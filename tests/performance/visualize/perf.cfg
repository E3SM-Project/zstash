# Performance profiling configuration – shared by both scripts:
#   visualize_performance.py        (pass via --cfg, or name it perf.cfg)
# Usage:
#   python visualize_performance.py [--cfg path/to/this/file]
# Default cfg file name (when no argument given): perf.cfg
#
# NOTE: Perlmutter home/scratch paths follow the pattern:
#   /global/homes/u/username/...
#   /pscratch/sd/u/username/...
# where u is the first letter of your username, e.g. user "forsyth" goes under "f".

# ---------------------------------------------------------------------------
# Results archiving
# ---------------------------------------------------------------------------

# Long-term (non-scratch) directory where results CSVs are copied at the end
# of a run.
performance_archive_dir=/global/homes/u/username/zstash_performance_records

# ---------------------------------------------------------------------------
# visualize_performance.py options  <- edit these for each new run
# ---------------------------------------------------------------------------

# Path to the results CSV to show in Figure 1.
# This is the CSV produced by generate_performance_data.bash for this run.
results_csv=/pscratch/sd/u/username/zstash_performance/performance_20260603/results.csv

# Path to a baseline results CSV to compare against in Figure 2.
# Leave blank (or comment out) to skip Figure 2.
baseline_results_csv=/pscratch/sd/u/username/zstash_performance/performance_20260414/results.csv

# Output path for the saved figures.
# Leave blank (or comment out) to display interactively instead of saving.
# Make sure to use the web-server path so the URL is printed correctly, e.g.:
#   /global/cfs/cdirs/e3sm/www/...
# When viz_run_id and most_recent_gen_run_id are both set, figures are saved
# under <output_dir>/<viz_run_id>/ using the filenames described below.
output_path=/global/cfs/cdirs/e3sm/www/username/zstash_performance/performance_pr427_20260603.png

# ---------------------------------------------------------------------------
# Output filename control
# ---------------------------------------------------------------------------

# Short identifier used as a top-level subdirectory for all output figures.
# When set together with most_recent_gen_run_id, figures are written to
#   <output_dir>/<viz_run_id>/
# and named as follows:
#   <most_recent_gen_run_id>.png
#   <most_recent_gen_run_id>_vs_baseline.png
#   record_create_and_update.png
#   record_extract.png
# Leave blank (or comment out) to use the stem of output_path (original behaviour).
# Example: viz_run_id=pr427_20260603
viz_run_id=

# Identifier for the most recent generate_performance_data.bash run.
# Used as the filename stem for Figures 1 & 2 and as a subdirectory under
# viz_run_id/.  Requires viz_run_id to also be set; ignored when viz_run_id
# is blank.
# Example: most_recent_gen_run_id=performance_20260603
most_recent_gen_run_id=

# ---------------------------------------------------------------------------
# HPSS mode filter
# ---------------------------------------------------------------------------

# Comma-separated list of HPSS modes to include in every figure.
# Valid values: none, hpss, globus  (case-insensitive, any order).
# Leave blank (or comment out) to include all three modes.
# Examples:
#   hpss_filter=none          # local-only runs, no HPSS bars
#   hpss_filter=none,hpss     # skip globus
#   hpss_filter=hpss,globus   # skip the no-HPSS baseline
hpss_filter=

# ---------------------------------------------------------------------------
# Figure selection
# ---------------------------------------------------------------------------

# Comma-separated list of figure numbers to produce.
# Valid values: 1, 2, 3, 4
#   1 = Performance overview (always available)
#   2 = Baseline comparison  (requires baseline_results_csv)
#   3 = Archive: create & update (requires performance_archive_dir)
#   4 = Archive: extract_seq & extract_par (requires performance_archive_dir)
# Leave blank (or comment out) to produce all applicable figures.
# Note: listing a figure number does not bypass its data requirements —
# the data must still be present.  Figures whose data is missing are skipped
# with a warning regardless of this setting.
# Examples:
#   figures=1         # overview only, fast
#   figures=1,2       # overview + baseline comparison
#   figures=3,4       # archive history only
figures=
