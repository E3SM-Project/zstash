# This version of perf.cfg has filled-in username paths.

# Performance profiling configuration – shared by both scripts:
#   generate_performance_data.bash  (pass as first argument, or name it perf.cfg)
#   visualize_performance.py        (pass via --cfg, or name it perf.cfg)
# Usage:
#   ./generate_performance_data.bash [path/to/this/file]
#   python visualize_performance.py [--cfg path/to/this/file]
# Default cfg file name (when no argument given): perf.cfg
#
# NOTE: Perlmutter home/scratch paths follow the pattern:
#   /global/homes/u/username/...
#   /pscratch/sd/u/username/...
# where u is the first letter of your username, e.g. user "forsyth" goes under "f".

# ---------------------------------------------------------------------------
# Run metadata  <- edit these for each new run
# ---------------------------------------------------------------------------

# Scratch directory where intermediate data and logs are written.
# Use /pscratch since a lot of data will be transferred.
work_dir=/pscratch/sd/f/forsyth/zstash_performance/

# Unique identifier for this run (used as a sub-directory name and CSV prefix).
unique_id=performance_20260603

# Shell command(s) that activate the zstash environment.
# Separate multiple commands with ' ; ' (space-semicolon-space).
# Example - Unified environment:
#   environment_commands=source /global/common/software/e3sm/anaconda_envs/load_latest_e3sm_unified_pm-cpu.sh
# Example - dev environment:
#   environment_commands=source /global/homes/u/username/miniforge3/etc/profile.d/conda.sh ; conda activate zstash-pr427-20260603
environment_commands=source /global/common/software/e3sm/anaconda_envs/load_latest_e3sm_unified_pm-cpu.sh

# ---------------------------------------------------------------------------
# Data source  <- usually no need to change these
# ---------------------------------------------------------------------------

dir_to_copy_from=/global/cfs/cdirs/e3sm/forsyth/E3SMv2/v2.LR.historical_0201/
subdir0=build/
subdir1=run/
subdir2=init/

# ---------------------------------------------------------------------------
# HPSS options
# ---------------------------------------------------------------------------

# Space-separated list of HPSS modes to exercise.
# Valid values: none  hpss  globus
HPSS_OPTIONS=none hpss globus

# Destination path on HPSS (used when hpss is in HPSS_OPTIONS).
dst_hpss_path=/home/f/forsyth/zstash_performance

# ---------------------------------------------------------------------------
# Globus options  <- used when globus is in HPSS_OPTIONS
# ---------------------------------------------------------------------------

# Set to true to force a fresh Globus authentication at the start of the run.
# NOTE: This will delete your ~/.zstash.ini & ~/.zstash_globus_tokens.json files.
fresh_globus=true

# UUID of the destination Globus endpoint.
# Common endpoints:
#   LCRC Improv DTN        15288284-7006-4041-ba1a-6b52501e49f1
#   NERSC Perlmutter       6bdc7956-fc0f-4ad2-989c-7aa5ee643a79
#   NERSC HPSS             9cd89cfd-6d04-11e5-ba46-22000b92c6ec
#   PIC Compy DTN          68fbd2fa-83d7-11e9-8e63-029d279f7e24
dst_endpoint_uuid=15288284-7006-4041-ba1a-6b52501e49f1

# Destination directory on the Globus endpoint.
dst_endpoint_archive_dir=/lcrc/group/e3sm/ac.forsyth2/zstash_performance_dst_dir/

# ---------------------------------------------------------------------------
# Results archiving
# ---------------------------------------------------------------------------

# Long-term (non-scratch) directory where the results CSV is copied at the end
# of a run. The file will be saved as:
#   ${performance_archive_dir}/${unique_id}_results.csv
performance_archive_dir=/global/homes/f/forsyth/zstash_performance_records

# ---------------------------------------------------------------------------
# visualize_performance.py options  <- edit these for each new run
# ---------------------------------------------------------------------------

# Path to the results CSV to show in Figure 1.
# This is the CSV produced by generate_performance_data.bash for this run.
results_csv=/pscratch/sd/f/forsyth/zstash_performance/performance_20260603/results.csv

# Path to a baseline results CSV to compare against in Figure 2.
# Leave blank (or comment out) to skip Figure 2.
baseline_results_csv=/pscratch/sd/f/forsyth/zstash_performance/performance_20260414/results.csv

# Output path for the saved figures.
# Leave blank (or comment out) to display interactively instead of saving.
# Make sure to use the web-server path so the URL is printed correctly, e.g.:
#   /global/cfs/cdirs/e3sm/www/...
output_path=/global/cfs/cdirs/e3sm/www/forsyth/zstash_performance/performance_pr427_20260603.png
